
name = "pstreamcloudflare"
main = "./.output/server/index.mjs"
workers_dev = true
compatibility_date = "2022-09-10"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
